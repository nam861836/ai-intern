name: CI
on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run a one-line script
        run: echo Hello, world!
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          cd chatbot
          pwd && ls -la
          pip install uv
          uv sync --frozen
      - name: Run unit tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          OPENAI_EMBED_MODEL: ${{ vars.OPENAI_EMBED_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          TEMPERATURE: ${{ vars.TEMPERATURE }}
        run: |
          cd chatbot
          source .venv/bin/activate
          cd app
          python -m pytest tests

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cấu hình AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login ECR
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      # Build backend
      - name: Build backend image
        run: |
          cd chatbot
          docker compose build backend

      # Tag & Push backend
      - name: Tag and push backend image
        run: |
          cd chatbot
          ECR_REPO=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/chatbot-backend
          docker tag chatbot-backend:latest $ECR_REPO:latest
          docker tag chatbot-backend:latest $ECR_REPO:${{ github.sha }}
          docker push $ECR_REPO:latest
          docker push $ECR_REPO:${{ github.sha }}

  # --- Frontend ---
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cấu hình AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login ECR
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      # Build frontend
      - name: Build frontend image
        run: |
          cd chatbot
          docker compose build frontend

      # Tag & Push frontend
      - name: Tag and push frontend image
        run: |
          cd chatbot
          ECR_REPO=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/chatbot-frontend
          docker tag chatbot-frontend:latest $ECR_REPO:latest
          docker tag chatbot-frontend:latest $ECR_REPO:${{ github.sha }}
          docker push $ECR_REPO:latest
          docker push $ECR_REPO:${{ github.sha }}

          

