name: CI
on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run a one-line script
        run: echo Hello, world!
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          cd chatbot
          pwd && ls -la
          pip install uv
          uv sync --frozen
      - name: Run unit tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          OPENAI_EMBED_MODEL: ${{ vars.OPENAI_EMBED_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          TEMPERATURE: ${{ vars.TEMPERATURE }}
        run: |
          cd chatbot
          source .venv/bin/activate
          cd app
          python -m pytest tests

  build_and_push_images:
    runs-on: ubuntu-latest
    #needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Backend ---
      - name: Build backend image
        run: |
          cd chatbot
          docker compose build backend

      - name: Tag and push backend
        run: |
          cd chatbot
          docker tag chatbot-backend:latest ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-backend:latest
          docker tag chatbot-backend:latest ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-backend:${{ github.sha }}

      # --- Frontend ---
      - name: Build frontend image
        run: |
          cd chatbot
          docker compose build frontend

      - name: Tag and push frontend
        run: |
          cd chatbot
          docker tag chatbot-frontend:latest ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-frontend:latest
          docker tag chatbot-frontend:latest ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-frontend:${{ github.sha }}


