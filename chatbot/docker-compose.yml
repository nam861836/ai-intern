services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    container_name: project_backend
    ports:
      - "8000:8000"
    networks:
      - project_network
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: project_frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000/v1
    depends_on:
      - backend
        # condition: service_healthy
    networks:
      - project_network
    restart: unless-stopped

networks:
  project_network:
    driver: bridge
